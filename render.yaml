services:
  - type: web
    name: ofi-reporting
    runtime: static
    # Uses node directly so Render does not depend on the package.json "build:render" script name
    buildCommand: npm ci && node scripts/render-build.mjs
    staticPublishPath: dist/ofi-reporting/browser
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Optional override; defaults to value in src/environments/environment.prod.ts
      - key: API_URL
        value: https://ofi-reporting-machine-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
